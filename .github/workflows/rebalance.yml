# Paper-account dry-run only. Schedule stays disabled.
# workflow_dispatch is available because this file already exists on main
# (PR #1 was merged). This revision removes the submit path entirely.

name: paper-rebalance

on:
  workflow_dispatch:
  # Execute on this PR branch when pushed, so we do not need to merge
  # and do not need to click Run workflow. Remove after the dry-run.
  push:
    branches:
      - cursor/paper-dry-run-actions-5ef3

  # schedule:
  #   - cron: "30 20 28-31 * *"   # kept disabled

jobs:
  paper-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Confirm paper keys exist (do not print values)
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          set +x
          if [ -z "${APCA_API_KEY_ID}" ] || [ -z "${APCA_API_SECRET_KEY}" ]; then
            echo "Missing APCA_API_KEY_ID or APCA_API_SECRET_KEY repository secret."
            exit 1
          fi
          echo "Paper API keys are present (values not printed)."
          echo "Key id length: ${#APCA_API_KEY_ID}"
          echo "Secret length: ${#APCA_API_SECRET_KEY}"
      - name: Paper dry-run (no submit)
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL: https://paper-api.alpaca.markets
        run: |
          set +x
          echo "Base URL=$APCA_API_BASE_URL"
          echo "Command: python run.py --paper --dry-run --force"
          python run.py --paper --dry-run --force
