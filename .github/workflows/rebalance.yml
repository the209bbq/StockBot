# Daily paper QQQ momentum. Never targets the live Alpaca endpoint.
# Schedule submits paper orders. workflow_dispatch defaults to dry-run.

name: paper-qqq-momentum

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Manual run mode. Default is dry-run (no orders)."
        required: false
        default: dry-run
        type: choice
        options:
          - dry-run
          - submit
  schedule:
    # Dual UTC hours so 15:50 America/New_York is hit in both DST regimes.
    # The job uses Alpaca's clock/calendar and skips the wrong hour,
    # weekends, holidays, and early closes (or evaluates before an early
    # close if the clock is in that window). last_live_session makes sure
    # only one cron trades per session.
    - cron: "50 19 * * 1-5"   # 15:50 ET during EDT (UTC-4)
    - cron: "50 20 * * 1-5"   # 15:50 ET during EST (UTC-5)

permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Restore SQLite (cache, fast path)
        uses: actions/cache@v4
        with:
          path: data/trader.db
          key: trader-db-${{ github.run_id }}
          restore-keys: |
            trader-db-
      - name: Restore SQLite (bot-state branch, source of truth)
        run: |
          set +x
          mkdir -p data
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch origin bot-state --depth=1
            if git cat-file -e origin/bot-state:data/trader.db 2>/dev/null; then
              git show origin/bot-state:data/trader.db > data/trader.db
              echo "Restored data/trader.db from origin/bot-state"
            else
              echo "origin/bot-state exists but has no data/trader.db" >&2
              exit 1
            fi
          else
            echo "No origin/bot-state branch yet (first run is fine)"
          fi
      - name: Guard paper-only base URL
        run: |
          set +x
          if [ "${APCA_API_BASE_URL:-https://paper-api.alpaca.markets}" != "https://paper-api.alpaca.markets" ]; then
            echo "Refusing to run: live trading needs explicit owner approval."
            exit 2
          fi
      - name: Confirm paper keys exist (do not print values)
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          set +x
          if [ -z "${APCA_API_KEY_ID}" ] || [ -z "${APCA_API_SECRET_KEY}" ]; then
            echo "Missing APCA_API_KEY_ID or APCA_API_SECRET_KEY repository secret."
            exit 1
          fi
          echo "Paper API keys are present (values not printed)."
          echo "Key id length: ${#APCA_API_KEY_ID}"
          echo "Secret length: ${#APCA_API_SECRET_KEY}"
      - name: Run paper bot
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL: https://paper-api.alpaca.markets
        run: |
          set +x
          echo "Base URL=$APCA_API_BASE_URL"
          echo "Event=${{ github.event_name }} mode=${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Command: python run.py --paper --submit"
            python run.py --paper --submit
          elif [ "${{ github.event.inputs.mode }}" = "submit" ]; then
            echo "Command: python run.py --paper --submit --force"
            python run.py --paper --submit --force
          else
            echo "Command: python run.py --paper --dry-run --force"
            python run.py --paper --dry-run --force
          fi
      - name: Persist SQLite and reports to bot-state
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +x
          if [ ! -f data/trader.db ]; then
            echo "No data/trader.db after a successful run" >&2
            exit 1
          fi
          if [ ! -f reports/latest.json ]; then
            echo "No reports/latest.json after a successful run" >&2
            exit 1
          fi
          STATE_DIR="${RUNNER_TEMP}/bot-state"
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git clone --depth=1 --branch bot-state "$REPO_URL" "$STATE_DIR"
          else
            git clone --depth=1 "$REPO_URL" "$STATE_DIR"
            git -C "$STATE_DIR" checkout --orphan bot-state
            git -C "$STATE_DIR" rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "$STATE_DIR/data" "$STATE_DIR/reports"
          cp data/trader.db "$STATE_DIR/data/trader.db"
          cp reports/latest.json "$STATE_DIR/reports/latest.json"
          cp reports/weekly.md "$STATE_DIR/reports/weekly.md"
          git -C "$STATE_DIR" config user.name "stockbot-state"
          git -C "$STATE_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$STATE_DIR" add data/trader.db reports/latest.json reports/weekly.md
          if git -C "$STATE_DIR" diff --cached --quiet; then
            echo "bot-state: no change"
            exit 0
          fi
          git -C "$STATE_DIR" commit -m "persist trader.db ${GITHUB_SHA:0:7} ${GITHUB_RUN_ID}"
          git -C "$STATE_DIR" push origin bot-state
          echo "Persisted data/trader.db and reports/ to origin/bot-state"
      - name: Upload SQLite artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trader-db
          path: |
            data/trader.db
            reports/
          if-no-files-found: error
          retention-days: 30
