# Personal paper-trading ETF rebalancer. Edit weights and bands here.
# Secrets never live in this file — use environment variables only.

paper_base_url: https://paper-api.alpaca.markets

target_weights:
  VTI: 0.55
  VXUS: 0.25
  BND: 0.20

# Month-end check: rebalance the whole book if any fund is more than
# this many percentage points away from its target weight.
rebalance_band_pp: 5.0

# Single on/off flag. When enabled, a month-end VTI close below its
# 200-day SMA moves the book to 100% BND until a later month-end close
# is back above the SMA.
trend_filter:
  enabled: true
  sma_days: 200
  signal_ticker: VTI
  risk_off_ticker: BND

# Paper account is $100k; only this much is the bot's sleeve. Surplus cash
# is ignored. Existing VTI/VXUS/BND lots can grow with the market; we never
# pull more than the cap from unmanaged cash.
capital_cap_usd: 100.0

# Alpaca fractional minimum is $1 notional. Keep ~$1 uninvested.
cash_buffer_usd: 1.0
cash_buffer_pct: 0.0
min_trade_notional: 1.0

risk:
  # Both caps are fractions of *managed* (capped) equity, so they scale
  # down to the $100 sleeve. 1.0 = one order can be the whole sleeve;
  # 2.0 = a full sell+buy rotation is allowed.
  max_order_notional_pct: 1.0
  max_daily_turnover_pct: 2.0
  kill_switch_file: .killswitch

timezone: America/Los_Angeles
db_path: data/trader.db

# Backtest defaults (must stay aligned with the attached research run).
backtest:
  start_capital: 100000.0
  slippage_bps: 5.0
  execution_lag_days: 1
  rf_ticker: "^IRX"
