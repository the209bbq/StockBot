# Personal paper-trading ETF rebalancer. Edit weights and bands here.
# Secrets never live in this file — use environment variables only.

paper_base_url: https://paper-api.alpaca.markets

target_weights:
  VTI: 0.55
  VXUS: 0.25
  BND: 0.20

# Month-end check: rebalance the whole book if any fund is more than
# this many percentage points away from its target weight.
rebalance_band_pp: 5.0

# Single on/off flag. When enabled, a month-end VTI close below its
# 200-day SMA moves the book to 100% BND until a later month-end close
# is back above the SMA.
trend_filter:
  enabled: true
  sma_days: 200
  signal_ticker: VTI
  risk_off_ticker: BND

# Leave a little cash uninvested so tiny drifts and settlement don't
# force trades, and skip legs smaller than min_trade_notional.
cash_buffer_pct: 0.01
min_trade_notional: 50.0

risk:
  # Dollar cap on a single order. Full risk-off rotations can be large.
  max_order_notional: 200000.0
  # Combined |buy| + |sell| notional / equity. 2.0 allows a 100% rotation.
  max_daily_turnover_pct: 2.0
  kill_switch_file: .killswitch

timezone: America/Los_Angeles
db_path: data/trader.db

# Backtest defaults (must stay aligned with the attached research run).
backtest:
  start_capital: 100000.0
  slippage_bps: 5.0
  execution_lag_days: 1
  rf_ticker: "^IRX"
